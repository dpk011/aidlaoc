# ---------------------------------------------------------------------------
# Builds the site and publishes it to GitHub Pages.
#
# This runs by itself every time a change lands on the main branch — you don't
# need to run anything on your own computer to publish. Give it a minute or
# two after saving, then refresh the site.
#
# One-time setup, in the repository's Settings > Pages:
#   1. Set "Source" to "GitHub Actions".
#   2. Under "Custom domain", enter  aidlaoc.org  and save.
#
# Based on the official workflow in Hugo's "Host on GitHub Pages" guide.
# ---------------------------------------------------------------------------
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish by hand from the Actions tab without changing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two changes land close together, let the newer one finish and win.
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep this in step with the version you use locally (run `hugo version`).
      HUGO_VERSION: 0.164.0
      # Post dates are written in Pacific time; building in the same zone keeps
      # the dates shown on the News page from shifting by a day.
      TZ: America/Los_Angeles
    steps:
      - name: Check out the site
        uses: actions/checkout@v7
        with:
          # Full history, so Hugo can tell when each page last changed.
          fetch-depth: 0

      - name: Set up GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          echo "Installing Hugo ${HUGO_VERSION}..."
          mkdir -p "${HOME}/.local/hugo"
          curl -sfL --output-dir "${RUNNER_TEMP}" -O \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "${RUNNER_TEMP}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "$GITHUB_PATH"

      - name: Show the Hugo version
        run: hugo version

      - name: Build the site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

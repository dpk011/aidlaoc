# ---------------------------------------------------------------------------
# Builds the site and publishes it to GitHub Pages.
#
# This runs by itself every time a change lands on the main branch — you don't
# need to run anything on your own computer to publish. Give it a minute or
# two after saving, then refresh the site.
#
# One-time setup, in the repository's Settings > Pages:
#   1. Set "Source" to "GitHub Actions".
#   2. Under "Custom domain", enter  aidlaoc.org  and save.
#
# The web address the site is built for comes from baseURL in hugo.toml.
# ---------------------------------------------------------------------------
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish by hand from the Actions tab without changing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# If two changes land close together, let the newer one finish and win.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep this in step with the version you use locally (run `hugo version`).
      HUGO_VERSION: 0.164.0
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          # Needed so each page can show an accurate "last modified" date.
          fetch-depth: 0

      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
          hugo version

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build the site
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --gc

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
